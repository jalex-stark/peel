function slots(cells){
 const map=new Map(cells.map(([x,y],i)=>[`${x},${y}`,i])),out=[];
 for(const [i,[x,y]] of cells.entries())for(const [dx,dy] of [[1,0],[0,1]]){
  if(map.has(`${x-dx},${y-dy}`))continue;
  const run=[];let a=x,b=y;
  while(map.has(`${a},${b}`)){run.push(map.get(`${a},${b}`));a+=dx;b+=dy;}
  if(run.length>1)out.push(run);
 }
 return out;
}
const bankKey=letters=>[...letters].sort().join('');
function measures(cells,letters,start=letters){
 const runs=slots(cells),words=runs.map(s=>s.map(i=>letters[i]).join(''));
 const values=words.map(w=>[...w].reduce((s,l)=>s+VALUES[l],0));
 const counts=cells.map((_,i)=>runs.filter(s=>s.includes(i)).length);
 return {words,changed:[...letters].filter((l,i)=>l!==start[i]).length,power:Math.max(0,...values),squares:values.reduce((s,v)=>s+v*v,0),crossings:counts.reduce((s,n,i)=>s+(n>1?VALUES[letters[i]]:0),0),variety:new Set(words).size};
}
function check(level,letters){
 if(typeof letters!=='string'||bankKey(letters)!==bankKey(level.bank))return {valid:false,reason:'Use exactly the supplied letter bank.'};
 const m=measures(level.cells,letters,level.start);
 const locked=level.locks.some(i=>letters[i]!==level.start[i]);
 const bad=m.words.filter(w=>!level.words.includes(w));
 const valid=!locked&&!bad.length&&m.changed<=level.budget;
 return {...m,valid,reason:locked?'An anchored letter moved.':bad.length?`Check ${[...new Set(bad)].join(', ')}.`:m.changed>level.budget?`Return ${m.changed-level.budget} changed tiles to their original letters.`:'All runs are allowed.'};
}
// Complete word-slot CSP. At each node choose the remaining slot with fewest
// compatible words, consuming only newly assigned letters from the exact bank.
function enumerate(cells,bank,words,{locks={}}={}){
 const runs=slots(cells),byLength=new Map(),answers=new Set();let nodes=0;
 for(const w of new Set(words)){if(!byLength.has(w.length))byLength.set(w.length,[]);byLength.get(w.length).push(w);}
 const board=Array(cells.length).fill(null),left={};for(const l of bank)left[l]=(left[l]||0)+1;
 for(const [k,l] of Object.entries(locks)){if(!left[l]||!board.hasOwnProperty(k))return {solutions:[],nodes:0};board[k]=l;left[l]--;}
 function candidates(run){return (byLength.get(run.length)||[]).filter(w=>{const need={};for(let j=0;j<run.length;j++){const l=w[j],old=board[run[j]];if(old&&old!==l)return false;if(!old){need[l]=(need[l]||0)+1;if(need[l]>(left[l]||0))return false;}}return true;});}

  let chosen,options;
  for(const run of todo){const list=candidates(run);if(!list.length)return;if(!options||list.length<options.length){chosen=run;options=list;}}
  for(const w of options){const added=[];chosen.forEach((i,j)=>{if(!board[i]){board[i]=w[j];left[w[j]]--;added.push(i);}});visit(todo.filter(r=>r!==chosen));for(const i of added){left[board[i]]++;board[i]=null;}}
 }
 visit(runs);return {solutions:[...answers].sort(),nodes};
}
function analyze(level){
 const all=enumerate(level.cells,level.bank,level.words),anchored=all.solutions.filter(s=>level.locks.every(i=>s[i]===level.start[i]));

 const legal=rows.filter(r=>r.changed<=level.budget);
 const best=legal.length?Math.max(...legal.map(r=>r[level.metric])):null;
 const frontier=rows.filter(a=>!rows.some(b=>b.changed<=a.changed&&b[level.metric]>=a[level.metric]&&(b.changed<a.changed||b[level.metric]>a[level.metric])));
 const distanceHistogram={};for(const r of rows)distanceHistogram[r.changed]=(distanceHistogram[r.changed]||0)+1;

 $('best').textContent=state.best?`Previously accepted best: ${state.best.value}, ${state.best.changed} changed sockets.${state.assisted?' Hints / solution report used.':''}`:state.assisted?'Hints / solution report used.':'No accepted attempt yet.';
 $('words').innerHTML=m.words.map((w,k)=>`<button class="word ${L.words.includes(w)?'good':'bad'}" data-run="${k}" title="Highlight this run">${w}<small>${[...w].reduce((s,l)=>s+VALUES[l],0)} pts</small></button>`).join('');
 for(const b of $('words').children){const mark=on=>{for(const i of runs[Number(b.dataset.run)])$('grid').children[i].classList.toggle('inspected',on);};b.onpointerenter=()=>mark(true);b.onpointerleave=()=>mark(false);b.onfocus=()=>mark(true);b.onblur=()=>mark(false);}
 paintSelection();
}
function undo(){if(!state.undo.length)return;state.redo.push(state.letters);state.letters=state.undo.pop();selected=null;hint=[];notice='';persist();record('undo');render();}
function redo(){if(!state.redo.length)return;state.undo.push(state.letters);state.letters=state.redo.pop();selected=null;hint=[];notice='';persist();record('redo');render();}
$('undo').onclick=undo;$('redo').onclick=redo;
$('reset').onclick=()=>{state.undo.push(state.letters);state.redo=[];state.letters=L.start;selected=null;hint=[];notice='Starting letters restored. You can undo this.';persist();record('reset');render();};
$('submit').onclick=()=>{const m=check(L,state.letters),pass=m.valid&&(L.target===null||m[L.metric]>=L.target);notice=pass?'Accepted. Nice work—this board meets every requirement.':m.valid?`Valid routing. Improve ${metricNames[L.metric].toLowerCase()} to ${L.target}.`:m.reason;if(pass&&(!state.best||m[L.metric]>state.best.value||m[L.metric]===state.best.value&&m.changed<state.best.changed))state.best={value:m[L.metric],changed:m.changed,letters:state.letters};persist();record('submit',{accepted:pass});render();};
$('hint').onclick=()=>{const i=[...state.letters].findIndex((l,i)=>l!==L.witness[i]);if(i<0){notice='This is already the verified target arrangement.';render();return;}const j=[...state.letters].findIndex((l,j)=>j!==i&&l===L.witness[i]&&l!==L.witness[j]&&!L.locks.includes(j));hint=[i,j];selected=null;notice=`Try swapping the two blue-marked tiles (${state.letters[i]} and ${state.letters[j]}). This moves toward a verified solution; intermediate states may exceed the final budget.`;state.assisted=true;persist();record('hint',{sockets:hint});render();};
$('analysis').addEventListener('toggle',()=>{if(!$('analysis').open)return;state.assisted=true;persist();record('inspect.solution-space');$('report').innerHTML=`<p>Exhaustive search: <b>${REPORT.total}</b> valid arrangements before anchors and budget; <b>${REPORT.anchored}</b> after anchors; <b>${REPORT.feasible}</b> within budget. Minimum repair distance: <b>${REPORT.minChanges}</b>. Best ${metricNames[L.metric].toLowerCase()}: <b>${REPORT.best}</b> (${REPORT.optimal} arrangements).</p><p>Equal letters are indistinguishable. Rotations and reflections count separately when they form allowed words. Counts cover this footprint only.</p><h3>Change / score frontier</h3><p>These outcomes cannot improve score or reduce changes without worsening the other.</p><table><thead><tr><th>Changed</th><th>Score</th><th>In budget</th></tr></thead><tbody>${[...new Set(REPORT.frontier.map(r=>`${r.changed},${r.value}`))].map(s=>{const [d,v]=s.split(',');return `<tr><td>${d}</td><td>${v}</td><td>${Number(d)<=L.budget?'Yes':'No'}</td></tr>`;}).join('')}</tbody></table><h3>Every feasible arrangement</h3><div class="solution-list">${REPORT.solutions.map(r=>`<p><b>${r.words.join(' / ')}</b><br>${r.changed} changed · ${metricNames[L.metric]} ${r[L.metric]}<br><code>${r.letters}</code></p>`).join('')}</div><p>Arrangement strings read sockets top-to-bottom, left-to-right, skipping gaps. Next swap hint walks to one optimal solution.</p>`;render();});
function download(name,text,type='text/plain'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('download').onclick=()=>download(`${L.id}.html`,'<!doctype html>\n'+document.documentElement.outerHTML,'text/html');
$('copy').onclick=async()=>{const text='PEELWORKS1.'+btoa(JSON.stringify({level:L.id,version:L.version,letters:state.letters}));try{await navigator.clipboard.writeText(text);notice='Attempt copied. Use Paste attempt in this level to restore it.';}catch{download(L.id+'-attempt.txt',text);notice='Clipboard unavailable; downloaded the attempt instead.';}record('export.attempt');render();};
$('import').onclick=()=>{const text=prompt('Paste a PEELWORKS1 attempt for this work order.');if(!text)return;try{if(!text.startsWith('PEELWORKS1.'))throw Error();const value=JSON.parse(atob(text.trim().slice(11)));if(value.level!==L.id||value.version!==L.version||bankKey(value.letters)!==L.bank||!L.locks.every(i=>value.letters[i]===L.start[i]))throw Error();state.undo.push(state.letters);state.redo=[];state.letters=value.letters;selected=null;hint=[];notice='Attempt restored.';persist();record('import.attempt');}catch{notice='That attempt does not match this level, bank, or anchors.';}render();};
$('history-download').onclick=async()=>{let events=[];if(historyDB){events=await new Promise((resolve,reject)=>{const r=historyDB.transaction('events').objectStore('events').index('level').getAll(L.id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);}).catch(()=>[]);}events.push(...historyQueue);download(L.id+'-history.json',JSON.stringify({level:L,events},null,2),'application/json');};
window.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='Escape'){selected=null;hint=[];paintSelection();}if(e.key.toLowerCase()==='z'){e.preventDefault();undo();}if(e.key.toLowerCase()==='y'){e.preventDefault();redo();}});
record('session.open');render();
</script></body></html>
